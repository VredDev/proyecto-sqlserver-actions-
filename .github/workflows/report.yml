name: Reporte Programado de Ventas

on:
  schedule:
    # Se ejecuta todos los domingos a las 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  generate-report:
    runs-on: ubuntu-latest

    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_PID: Developer
          SA_PASSWORD: ${{ secrets.MSSQL_SA_PASSWORD }}
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$SA_PASSWORD\" -C -Q \"SELECT 1\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar herramientas cliente MSSQL
        run: |
          curl https://packages.microsoft.com/keys/microsoft.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/microsoft.gpg
          curl https://packages.microsoft.com/config/ubuntu/22.04/prod.list | sudo tee /etc/apt/sources.list.d/msprod.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y mssql-tools18 unixodbc-dev
          echo "/opt/mssql-tools18/bin" >> $GITHUB_PATH

      - name: Configurar Base de Datos con Datos
        env:
          SA_PASSWORD: ${{ secrets.MSSQL_SA_PASSWORD }}
        run: |
          sqlcmd -S localhost,1433 -U sa -P "$SA_PASSWORD" -C -i ./sql/01_create_database.sql
          sqlcmd -S localhost,1433 -U sa -P "$SA_PASSWORD" -C -i ./sql/02_create_tables.sql
          sqlcmd -S localhost,1433 -U sa -P "$SA_PASSWORD" -C -i ./sql/03_create_procedure.sql
          sqlcmd -S localhost,1433 -U sa -P "$SA_PASSWORD" -C -i ./sql/04_create_trigger.sql
          sqlcmd -S localhost,1433 -U sa -P "$SA_PASSWORD" -C -i ./sql/05_test_data.sql

      - name: Generar Reporte CSV de Ventas y Auditoría
        env:
          SA_PASSWORD: ${{ secrets.MSSQL_SA_PASSWORD }}
        run: |
          mkdir -p outputs
          sqlcmd -S localhost,1433 -U sa -P "$SA_PASSWORD" -C -d EmpresaDB -W -s "," -k 1 -Q "
          SET NOCOUNT ON;
          SELECT 
              v.VentaID,
              v.Producto,
              v.Cantidad,
              CONVERT(VARCHAR(19), v.Fecha, 120) AS FechaVenta,
              a.AuditoriaID,
              a.Mensaje
          FROM dbo.Ventas v
          INNER JOIN dbo.AuditoriaVentas a ON v.VentaID = a.VentaID
          ORDER BY v.VentaID ASC;
          " | sed '/^[-=]/d' > outputs/reporte_ventas.csv

          echo "Vista previa del reporte generado:"
          cat outputs/reporte_ventas.csv

      - name: Publicar Reporte como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: reporte-ventas-semanal
          path: outputs/reporte_ventas.csv
          retention-days: 14